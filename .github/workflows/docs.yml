# 文档站部署（GitHub Pages 主站 + Netlify 国内镜像）
#
# 触发时机 = 发布时机：只有推 v* 标签（发版）或手动触发时才构建并部署。
# 平时往 main 推送的文档改动只留在仓库里，不会改变线上页面——
# 需要让某个改动上线时，要么随下一次发版，要么在 Actions 里手动运行本工作流。
#
# 主站（GitHub Pages，jobs：check / build / deploy）：
#   - 首次使用：仓库 Settings → Pages → Source 选「GitHub Actions」。
#     未启用前 build / deploy 会自动跳过（保持绿色），启用后无需再改任何配置。
#   - 注意（tag 部署被拒时查这里）：启用 Pages 后 GitHub 会自动建 `github-pages` 环境，
#     其「Deployment branches and tags」默认只允许默认分支部署——tag 推送会在 deploy 步
#     被拒（annotations 提示 not allowed due to environment protection rules）。
#     解法：Settings → Environments → github-pages → 放行标签（选 Selected branches and
#     tags 加一条 Tag 规则 `v*`，并保留分支 main 供手动预览；或直接选 All branches and tags）。
#
# 国内镜像（Netlify，job：mirror）：
#   - 站点地址：https://dnddicer.netlify.app （根路径部署；构建时用 DOCS_BASE=/ 覆盖 base，
#     见 docs/.vitepress/config.mts）。
#   - 依赖仓库 Secrets 里的 NETLIFY_AUTH_TOKEN（Netlify「用户设置 → Applications →
#     Personal access tokens」创建，创建时需选有效期，到期后重新生成并更新此 Secret）
#     与 NETLIFY_SITE_ID（站点配置 → 常规 → Site information → Site ID）；未配置时 mirror
#     自动跳过。
#   - Netlify 默认开启 Pretty URLs（/foo 与 /foo.html 均可命中 foo.html），并自动启用产物里的
#     404.html，无需额外配置（2026-09-26 核官方文档）。
name: docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      mirror_ready: ${{ steps.mirror_token.outputs.ready }}
    steps:
      - name: 检查 Pages 是否已启用
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，继续构建与部署。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=文档站尚未启用::仓库 Settings → Pages 还没把 Source 选为 GitHub Actions，跳过本次部署；启用后手动运行本工作流、或等下一次发版即可。"
          fi
      - name: 检查国内镜像凭据是否已配置
        id: mirror_token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=国内镜像尚未配置::仓库 Secrets 里还没有 NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID，跳过国内镜像部署；配置后手动运行本工作流、或等下一次发版即可。"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装文档站依赖
        run: npm ci
      # docs:build 自带「从 CHANGELOG.md 生成《更新日志》页」一步，站点更新日志随仓库同步
      - name: 构建文档站
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  mirror:
    needs: check
    if: needs.check.outputs.mirror_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装文档站依赖
        run: npm ci
      # 与主站同一份源码，用 DOCS_BASE=/ 覆盖 base：镜像站部署在根路径
      - name: 构建镜像站（根路径）
        run: npm run docs:build
        env:
          DOCS_BASE: /
      - name: 部署到 Netlify
        # 锁 netlify-cli@27 大版本（当前 27.9.0），避免上游破坏性更新影响发版
        run: |
          npx --yes netlify-cli@27 deploy \
            --dir=docs/.vitepress/dist \
            --no-build --prod \
            --message "docs mirror $GITHUB_SHA" \
            --json \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
