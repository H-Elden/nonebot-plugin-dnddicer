<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{{ css }}
</style>
</head>
<body>
<div class="card">
  <div class="title">{{ title }}</div>
  <div class="meta">
    {% if category %}<span class="chip">{{ category }}</span>{% endif %}
    <span class="source">5E 不全书</span>
  </div>
  <div class="divider"></div>
  <div class="content">
    {% if fallback_note %}<div class="note">{{ fallback_note }}</div>{% endif %}
    {{ body_html | safe }}
  </div>
  <div class="footer">
    <span class="footer-source">《5e不全书》</span>{% if source_path %}<span class="footer-path">{{ source_path }}</span>{% endif %}
  </div>
</div>
</body>
</html>
